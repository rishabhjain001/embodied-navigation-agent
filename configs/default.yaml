ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  total_timesteps: 500000

env:
  grid_size: 10          # overridden by GRID_SIZE env var
  object_count: 5        # overridden by OBJECT_COUNT env var
  step_budget: 200       # overridden by STEP_BUDGET env var

reward:
  step_closer: 0.1
  step_away: -0.1
  collision: -0.5
  success: 10.0
  timeout: -5.0
